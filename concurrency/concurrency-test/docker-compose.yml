version: '3.8'
services:
  mysql:
    image: olivejua/ex_store:1.0
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    env_file:
      - .env
  redis:
    image: redis
    ports:
      - "6379:6379"
